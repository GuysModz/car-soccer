<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google Classroom - Game Library</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151922;
      --card-border: #222938;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --badge-bg: rgba(99, 102, 241, 0.15);
      --badge-text: #818cf8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 32px 24px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* Hero Header */
    .header-box {
      background: linear-gradient(180deg, #181d28 0%, #121620 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
      position: relative;
    }
    .top-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .header-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-badge {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
    .header-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 14px;
      max-width: 700px;
      line-height: 1.5;
    }

    /* Sub-bar / Search & Counts */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .section-title { font-size: 20px; font-weight: 700; }
    .game-count { font-size: 13px; color: var(--text-muted); font-weight: 400; margin-left: 8px; }
    .search-input {
      background: #181d28;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      width: 280px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 140px;
      transition: transform 0.15s ease, border-color 0.15s ease;
      position: relative;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #3b4252;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      color: #fff;
    }
    .tag-new {
      font-size: 10px;
      font-weight: 700;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .play-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 9px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease;
      width: 100%;
    }
    .play-btn:hover { background: #6366f1; }

    /* Fullscreen Game Player Modal */
    #player-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100000;
      flex-direction: column;
    }
    #player-topbar {
      height: 48px;
      background: #11141c;
      border-bottom: 1px solid #222938;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .player-title { font-weight: 700; font-size: 15px; color: #fff; }
    .btn-group { display: flex; gap: 8px; }
    .tool-btn {
      background: #1f2533;
      color: #fff;
      border: 1px solid #333d52;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tool-btn:hover { background: #2b3447; }
    .close-btn { background: #e11d48; border-color: #f43f5e; }
    .close-btn:hover { background: #be123c; }
    #game-frame { width: 100%; height: calc(100% - 48px); border: none; }

    /* Watermark */
    #guyzmodz-watermark {
      position: fixed;
      bottom: 12px;
      right: 18px;
      z-index: 99999;
      font-size: 13px;
      font-weight: 800;
      pointer-events: none;
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow 6s linear infinite;
    }
    @keyframes rainbow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-box">
      <div class="top-badge">BROWSER GAME PORTAL</div>
      <div class="header-title-row">
        <div class="brand">
          <div class="logo-badge">G+</div>
          <h1>GuyzModz Unblocked Games</h1>
        </div>
      </div>
      <p class="header-sub">
        Choose a game below. The embedded player loads your selections with native fullscreen and instant camouflage mode.
      </p>
    </div>

    <div class="toolbar">
      <div class="section-title">
        All Games <span class="game-count" id="count-label"></span>
      </div>
      <input type="text" id="search-box" class="search-input" placeholder="Search games...">
    </div>

    <div class="grid" id="games-grid"></div>
  </div>

  <!-- Player Modal -->
  <div id="player-modal">
    <div id="player-topbar">
      <span class="player-title" id="active-game-title">Game Player</span>
      <div class="btn-group">
        <button class="tool-btn" onclick="togglePlayerFullscreen()">Fullscreen</button>
        <button class="tool-btn close-btn" onclick="closeGame()">Close Game</button>
      </div>
    </div>
    <iframe id="game-frame" allow="autoplay; gamepad; fullscreen"></iframe>
  </div>

  <div id="guyzmodz-watermark">Made by GuyzModz</div>

  <script>
    // Games Registry (Add/edit entries here)
    const GAMES = [
      { name: "Car Soccer (3D)", url: "https://car-soccer-remake.vercel.app", isNew: true },
      { name: "Retro Bowl", url: "https://game316009.hostingerapp.com/", isNew: true },
      { name: "1v1.LOL", url: "https://1v1.lol", isNew: false },
      { name: "Slope", url: "https://kdata1.com/2020/05/slope/", isNew: true },
      { name: "Minecraft 1.12", url: "https://eaglercraft.com/mc/1.12/", isNew: false },
      { name: "Drift Hunters", url: "https://webglmath.github.io/drift-hunters/", isNew: true },
      { name: "Diep.io", url: "https://diep.io", isNew: false },
      { name: "Cookie Clicker", url: "https://orteil.dashnet.org/cookieclicker/", isNew: false },
      { name: "Subway Surfers", url: "https://subway-surfers.org/", isNew: true },
      { name: "Geometry Dash", url: "https://scratch.mit.edu/projects/105500895/embed", isNew: false },
      { name: "Smash Karts", url: "https://smashkarts.io", isNew: true },
      { name: "Paper.io 2", url: "https://paper-io.com", isNew: false }
    ];

    const grid = document.getElementById("games-grid");
    const searchBox = document.getElementById("search-box");
    const countLabel = document.getElementById("count-label");

    function renderGames(list) {
      grid.innerHTML = "";
      countLabel.textContent = `${list.length} games available`;
      list.forEach(game => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-top">
            <span class="card-title">${game.name}</span>
            ${game.isNew ? '<span class="tag-new">NEW</span>' : ''}
          </div>
          <button class="play-btn" onclick="launchGame('${game.name}', '${game.url}')">PLAY</button>
        `;
        grid.appendChild(card);
      });
    }

    searchBox.addEventListener("input", e => {
      const q = e.target.value.toLowerCase();
      renderGames(GAMES.filter(g => g.name.toLowerCase().includes(q)));
    });

    function launchGame(name, url) {
      document.getElementById("active-game-title").textContent = name;
      document.getElementById("game-frame").src = url;
      document.getElementById("player-modal").style.display = "flex";
    }

    function closeGame() {
      document.getElementById("game-frame").src = "about:blank";
      document.getElementById("player-modal").style.display = "none";
    }

    function togglePlayerFullscreen() {
      const el = document.getElementById("player-modal");
      if (!document.fullscreenElement) {
        el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen?.();
      } else {
        document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen?.();
      }
    }

    // Panic Key: press ` backtick to redirect instantly to Classroom
    window.addEventListener("keydown", e => {
      if (e.key === "`") window.location.replace("https://classroom.google.com");
    });

    renderGames(GAMES);
  </script>
</body>
</html>
